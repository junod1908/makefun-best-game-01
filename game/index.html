<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKYWARDEN — Shield the Floating City</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #070b26;
      color: #fff2cf;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 20px; font-size: clamp(24px, 4vw, 38px); letter-spacing: 0.22em; }
    canvas {
      display: block;
      width: min(960px, 100%);
      height: auto;
      background: #0c1238;
      border: 1px solid #806432;
      border-radius: 14px;
      box-shadow: 0 16px 60px #03051680;
    }
    p { margin: 16px 0 0; color: #8492bd; font-size: clamp(10px, 1.8vw, 14px); white-space: nowrap; }
  </style>
</head>
<body>
  <h1>SKYWARDEN</h1>
  <canvas id="game" width="960" height="540"></canvas>
  <p>Mouse or arrow keys move the shield · Shift/Space dash · Hold E for slow-time · M mute</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
